name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update module manifest
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"

          jq \
            --arg version "$VERSION" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}" \
            --arg manifest "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/module.json" \
            --arg download "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/module.zip" \
            '
              .version = $version |
              .url = $url |
              .manifest = $manifest |
              .download = $download
            ' module.json > module.tmp.json

          mv module.tmp.json module.json

      - name: Create module.zip
        run: |
          zip -r module.zip \
            module.json \
            assets \
            css \
            database \
            external \
            lang \
            packs \
            src \
            styles \
            templates \
            LICENSE \
            AUTHORS

      - name: Verify package
        run: |
          echo "Version: ${GITHUB_REF_NAME}"
          ls -lh module.json module.zip
          jq '.version, .manifest, .download' module.json

      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            module.json \
            module.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Foundry VTT v14 compatibility" \
            --draft

      - name: Verify attached assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false
